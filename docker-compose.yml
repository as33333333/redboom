version: "3.8"
services:
  # 抖音数据服务（GitHub skill）—— 首次使用请按官方文档配置 Cookie/风控
  # 参考：https://github.com/Evil0ctal/Douyin_TikTok_Download_API
  douyin-api:
    image: evil0ctal/douyin_tiktok_download_api:latest
    ports:
      - "80:80"
    restart: unless-stopped

  # 应用后端（本项目）
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/site/backend/app.db}
      - DOUYIN_API_BASE=http://douyin-api:80   # 留空则走 mock
      - DOUYIN_MIN_REQUEST_INTERVAL_SECONDS=${DOUYIN_MIN_REQUEST_INTERVAL_SECONDS:-2.0}
      - DOUYIN_MAX_POSTS_PER_FETCH=${DOUYIN_MAX_POSTS_PER_FETCH:-10}
      - LLM_API_KEY=${LLM_API_KEY:-}            # 留空则分析走 mock
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      - ./:/app/site
    depends_on:
      - douyin-api
